<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}SpeedyFiles{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
  :root {
    --bg: #0f1419; --panel: #1a1f29; --border: #2a323e;
    --fg: #e6e6e6; --muted: #9aa4b2; --accent: #4f9eed; --danger: #e07b7b;
    --good: #6fcf97;
  }
  * { box-sizing: border-box; }
  body { margin:0; font: 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
         background: var(--bg); color: var(--fg); }
  header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 10px 20px;
           display: flex; align-items: center; gap: 16px; }
  header .brand { font-weight: 600; }
  header nav { display: flex; gap: 14px; flex: 1; }
  header nav a { color: var(--muted); text-decoration: none; }
  header nav a:hover, header nav a.active { color: var(--fg); }
  header .user { color: var(--muted); font-size: 12px; }
  main { max-width: 1100px; margin: 24px auto; padding: 0 20px; }
  h1 { font-size: 20px; margin: 0 0 16px 0; }
  h2 { font-size: 16px; margin: 24px 0 12px 0; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
           padding: 16px; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase;
       letter-spacing: 0.04em; }
  a { color: var(--accent); }
  .btn { display: inline-block; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border);
         background: var(--panel); color: var(--fg); text-decoration: none; cursor: pointer;
         font: inherit; }
  .btn:hover { border-color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #0a1828; font-weight: 600; }
  .btn-danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  input[type=text], input[type=email], input[type=password], input[type=number],
  textarea, select {
    width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--fg); font: inherit;
  }
  label { display: block; margin: 12px 0 4px 0; color: var(--muted); font-size: 12px;
          text-transform: uppercase; letter-spacing: 0.04em; }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px;
          background: var(--border); color: var(--muted); }
  .pill-active { background: rgba(111,207,151,0.15); color: var(--good); }
  .pill-revoked, .pill-expired { background: rgba(224,123,123,0.15); color: var(--danger); }
  .muted { color: var(--muted); }
  .danger { color: var(--danger); }
  .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  form.inline { display: inline; }
  .alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px;
           background: rgba(224,123,123,0.1); border: 1px solid var(--danger); color: var(--danger); }
  .file-row { display: flex; gap: 8px; align-items: center; padding: 6px 0;
              border-bottom: 1px dotted var(--border); }
  .file-row:last-child { border-bottom: none; }
  .progress { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
              margin-top: 4px; }
  .progress > div { height: 100%; background: var(--accent); transition: width .15s; }
</style>
</head>
<body>
{% if user is defined and user %}
<header>
  <a href="/dash" class="brand" style="display:inline-flex; align-items:center; gap:10px; text-decoration:none; color:inherit">
    <img src="/static/logo.png" alt="" style="height:32px; width:auto" onerror="this.style.display='none'">
    <span style="font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; font-weight: 600; font-size: 18px; letter-spacing: -0.01em; color: var(--fg);">SpeedyFiles</span>
  </a>
  <nav>
    <a href="/dash">Packages</a>
    <a href="/dash/packages/new/outbound">Send</a>
    <a href="/dash/packages/new/inbound">Request upload</a>
    {% if user.role == 'admin' %}<a href="/admin/users">Users</a>{% endif %}
    {% if user.role == 'admin' %}<a href="/admin/settings">Settings</a>{% endif %}
  </nav>
  <div class="user">
    <a href="/account" style="color:inherit">{{ user.display_name }}</a> ({{ user.role }})
    <form action="/logout?_csrf={{ csrf_token(request) }}" method="post" class="inline" style="display:inline; margin-left:8px;">
      <button class="btn" style="padding:4px 10px">Logout</button>
    </form>
  </div>
</header>
{% endif %}
<main>{% block content %}{% endblock %}</main>
</body>
</html>
