{% extends "base.html" %}
{% block title %}Send files{% endblock %}
{% block content %}
<h1>Send files to a customer</h1>
<div class="panel" style="max-width:780px">
<form id="outbound-form" method="post" action="/dash/packages/new/outbound?_csrf={{ csrf_token(request) }}" enctype="multipart/form-data">
  <label>Title</label>
  <input type="text" name="title" required placeholder="e.g. Demo masters — Acme Corp">
  <div class="row">
    <div>
      <label>Recipient name</label>
      <input type="text" name="recipient_name" required>
    </div>
    <div>
      <label>Recipient email</label>
      <input type="email" name="recipient_email" required>
    </div>
  </div>
  <label>Note (optional, included in email)</label>
  <textarea name="note" rows="3"></textarea>
  <div class="row">
    <div>
      <label>Expires in (days)</label>
      <input type="number" name="ttl_days" value="{{ default_ttl_days }}" min="1" max="90" required>
    </div>
  </div>

  <label>Files</label>
  <!-- Drag-drop zone wraps the (visually-hidden) file input + an "Add files" button -->
  <div id="dropzone" tabindex="0"
       style="padding:18px; border:1.5px dashed var(--border); border-radius:10px;
              background:rgba(94,198,255,0.03); text-align:center; cursor:pointer;
              transition: all 0.15s ease;">
    <input type="file" id="file-picker" name="files" multiple
           style="position:absolute; left:-9999px; width:1px; height:1px; opacity:0;">
    <div style="font-size:14px; color:var(--fg)">
      <b>Click to add files</b> or drag-and-drop here
    </div>
    <div class="muted" style="font-size:12px; margin-top:4px">
      You can click multiple times to add more — selections accumulate.
    </div>
  </div>

  <!-- Live selection list (visible as soon as files are picked) -->
  <div id="selection-summary" style="display:none; margin-top:12px; padding:12px 14px;
                                     border:1px solid var(--border); border-radius:8px;
                                     background:rgba(94,198,255,0.04)">
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px">
      <div style="font-size:13px"><b id="sel-count">0</b> file<span id="sel-plural">s</span> queued · total <b id="sel-bytes">0 B</b></div>
      <button type="button" id="sel-clear" class="btn"
              style="padding:3px 10px; font-size:12px">Clear all</button>
    </div>
    <div id="sel-list" style="font-size:13px; max-height:240px; overflow-y:auto;
                              border-top:1px solid var(--border); padding-top:8px"></div>
  </div>

  <div id="upload-list" style="margin-top:12px"></div>
  <div id="overall" style="display:none; margin-top:12px">
    <div class="muted" style="font-size:12px">Overall: <span id="overall-text">0 / 0 bytes</span></div>
    <div class="progress" style="height:6px"><div id="overall-bar" style="width:0%"></div></div>
  </div>

  <div style="margin-top:16px">
    <button class="btn btn-primary" id="submit-btn" type="submit">Send</button>
    <a class="btn" href="/dash">Cancel</a>
    <span id="status" class="muted" style="margin-left:12px"></span>
  </div>
</form>
</div>

<style>
  #dropzone:hover { border-color: var(--accent); background: rgba(94,198,255,0.06); }
  #dropzone.dragover {
    border-color: var(--accent-2); background: rgba(94,198,255,0.12);
    transform: scale(1.005);
  }
  .sel-item {
    display: flex; align-items: center; gap: 10px; padding: 6px 0;
    border-bottom: 1px dotted var(--border);
  }
  .sel-item:last-child { border-bottom: none; }
  .sel-item .name { flex: 1; min-width: 0; overflow: hidden;
                    text-overflow: ellipsis; white-space: nowrap; }
  .sel-item .size { color: var(--muted); font-size: 12px; }
  .sel-item .remove {
    background: none; border: none; color: var(--danger); cursor: pointer;
    font-size: 18px; padding: 0 4px; line-height: 1; opacity: 0.6;
  }
  .sel-item .remove:hover { opacity: 1; }
</style>

<script>
(function() {
  const form      = document.getElementById('outbound-form');
  const picker    = document.getElementById('file-picker');
  const dropzone  = document.getElementById('dropzone');
  const list      = document.getElementById('upload-list');
  const overall   = document.getElementById('overall');
  const overallBar = document.getElementById('overall-bar');
  const overallTxt = document.getElementById('overall-text');
  const submitBtn = document.getElementById('submit-btn');
  const statusEl  = document.getElementById('status');
  const csrf      = new URLSearchParams(form.action.split('?')[1]).get('_csrf');
  const summary   = document.getElementById('selection-summary');
  const selCount  = document.getElementById('sel-count');
  const selBytes  = document.getElementById('sel-bytes');
  const selList   = document.getElementById('sel-list');
  const selPlural = document.getElementById('sel-plural');
  const selClear  = document.getElementById('sel-clear');

  function log(...args) { try { console.log('[speedyfiles]', ...args); } catch(e) {} }
  function fmt(n) {
    const u=['B','KB','MB','GB','TB']; let i=0;
    while (n>=1024 && i<u.length-1) { n/=1024; i++; }
    return (i ? n.toFixed(1) : n) + ' ' + u[i];
  }
  function fmtDuration(ms) {
    if (ms < 1000) return ms + ' ms';
    const s = ms / 1000;
    if (s < 60) return s.toFixed(1) + 's';
    const totSec = Math.round(s);
    const m = Math.floor(totSec / 60), sec = totSec % 60;
    if (m < 60) return m + 'm ' + sec + 's';
    const h = Math.floor(m / 60), rm = m % 60;
    return h + 'h ' + rm + 'm ' + sec + 's';
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  // ============================================================
  // SELECTION STATE — running list, append-on-pick, dedupe
  //
  // The native <input type=file multiple> REPLACES its selection each
  // time the picker opens — so the naive UX would silently drop the
  // user's previous picks. We keep our own array and treat each
  // change/drop event as "add these to the running selection".
  // ============================================================
  const state = { files: [] };
  function fileKey(f) {
    // Best identity we have for a File without reading bytes:
    return f.name + '|' + f.size + '|' + (f.lastModified || 0);
  }

  function addFiles(newFiles) {
    const before = state.files.length;
    const seen = new Set(state.files.map(fileKey));
    let added = 0, duped = 0;
    for (const f of newFiles) {
      const k = fileKey(f);
      if (seen.has(k)) { duped++; continue; }
      state.files.push(f); seen.add(k); added++;
    }
    log(`add: ${newFiles.length} new (${added} added, ${duped} dupes) → ${state.files.length} total`);
    refreshSelectionPreview();
    return added;
  }

  function removeFileAt(idx) {
    if (idx < 0 || idx >= state.files.length) return;
    const removed = state.files.splice(idx, 1)[0];
    log(`remove: ${removed.name} → ${state.files.length} total`);
    refreshSelectionPreview();
  }

  function clearFiles() {
    state.files = [];
    log('cleared selection');
    refreshSelectionPreview();
  }

  function refreshSelectionPreview() {
    const files = state.files;
    if (!files.length) {
      summary.style.display = 'none';
      return;
    }
    summary.style.display = 'block';
    selCount.textContent = files.length;
    selPlural.textContent = files.length === 1 ? '' : 's';
    const total = files.reduce((a, f) => a + f.size, 0);
    selBytes.textContent = fmt(total);
    selList.innerHTML = files.map((f, i) =>
      `<div class="sel-item">
         <div class="name">${i + 1}. ${escapeHtml(f.name)}</div>
         <div class="size">${fmt(f.size)}</div>
         <button type="button" class="remove" data-idx="${i}" title="Remove">×</button>
       </div>`).join('');
    selList.querySelectorAll('button.remove').forEach(btn => {
      btn.addEventListener('click', () => removeFileAt(parseInt(btn.dataset.idx, 10)));
    });
  }

  // ============================================================
  // INPUTS — file picker + drag-drop + click-to-open
  // ============================================================
  picker.addEventListener('change', () => {
    const newFiles = Array.from(picker.files || []);
    addFiles(newFiles);
    // Reset so the SAME file can be picked again later (the change event
    // wouldn't fire otherwise); also so the form's native FormData doesn't
    // re-include these.
    picker.value = '';
  });

  // Clicking anywhere on the dropzone opens the file picker. Skip when
  // the click originated inside the file-input itself (defensive).
  dropzone.addEventListener('click', (e) => {
    if (e.target === picker) return;
    picker.click();
  });
  dropzone.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); picker.click(); }
  });

  // Drag-and-drop
  ['dragenter', 'dragover'].forEach(evt =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault(); e.stopPropagation();
      dropzone.classList.add('dragover');
    })
  );
  ['dragleave', 'drop'].forEach(evt =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault(); e.stopPropagation();
      dropzone.classList.remove('dragover');
    })
  );
  dropzone.addEventListener('drop', (e) => {
    const files = Array.from(e.dataTransfer.files || []);
    if (files.length) addFiles(files);
  });

  selClear.addEventListener('click', clearFiles);

  // ============================================================
  // UPLOAD
  // ============================================================
  let rows = [];
  let totalBytes = 0;

  function buildRows(files) {
    list.innerHTML = '';
    rows = [];
    totalBytes = 0;
    files.forEach((f, i) => {
      const row = document.createElement('div');
      row.className = 'file-row';
      row.innerHTML =
        '<div style="flex:1; min-width:0">'
        + '<div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
        + (i + 1) + '. ' + escapeHtml(f.name) + '</div>'
        + '<div class="muted" style="font-size:12px">' + fmt(f.size) + ' <span class="fspeed"></span></div>'
        + '<div class="progress bar"><div style="width:0%"></div></div>'
        + '</div>'
        + '<span class="fstatus muted" style="min-width:90px;text-align:right">queued</span>';
      list.appendChild(row);
      row._loaded = 0;
      row._file = f;
      row._index = i;
      rows.push(row);
      totalBytes += f.size;
    });
    if (rows.length) {
      overall.style.display = 'block';
      updateOverall();
    }
  }

  function updateOverall() {
    const loaded = rows.reduce((a, r) => a + (r._loaded || 0), 0);
    const pct = totalBytes ? (loaded / totalBytes * 100) : 0;
    overallBar.style.width = pct.toFixed(1) + '%';
    overallTxt.textContent = fmt(loaded) + ' / ' + fmt(totalBytes)
                           + ' (' + pct.toFixed(1) + '%)';
  }

  function uploadOne(pkgId, row) {
    return new Promise((resolve, reject) => {
      const file = row._file;
      if (!file) return reject(new Error('missing file reference on row ' + row._index));
      const xhr = new XMLHttpRequest();
      const fd = new FormData();
      fd.append('file', file);
      const bar    = row.querySelector('.bar > div');
      const status = row.querySelector('.fstatus');
      const speed  = row.querySelector('.fspeed');
      status.textContent = 'uploading…';
      log(`[${row._index + 1}/${rows.length}] start: ${file.name} (${fmt(file.size)})`);

      let lastBytes = 0, lastT = performance.now();
      xhr.upload.onprogress = (ev) => {
        if (!ev.lengthComputable) return;
        bar.style.width = (ev.loaded / ev.total * 100).toFixed(1) + '%';
        const now = performance.now();
        const dt = (now - lastT) / 1000;
        if (dt > 0.5) {
          const bps = (ev.loaded - lastBytes) / dt;
          speed.textContent = fmt(bps) + '/s';
          lastBytes = ev.loaded; lastT = now;
        }
        row._loaded = ev.loaded;
        updateOverall();
      };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          bar.style.width = '100%';
          row._loaded = file.size;
          updateOverall();
          let dur = null;
          try { const j = JSON.parse(xhr.responseText); dur = j.duration_ms; row._duration_ms = dur; } catch(e) {}
          status.innerHTML = '<span style="color:var(--good)">✓</span> done';
          if (dur != null) {
            const bps = file.size * 1000 / Math.max(dur, 1);
            speed.textContent = 'Transferred ' + fmt(file.size) + ' in ' + fmtDuration(dur)
                              + ' (' + fmt(bps) + '/s)';
          }
          log(`[${row._index + 1}/${rows.length}] done: ${file.name}`);
          resolve();
        } else {
          status.innerHTML = '<span class="danger">failed (' + xhr.status + ')</span>';
          speed.textContent = '';
          log(`[${row._index + 1}/${rows.length}] FAILED ${xhr.status}: ${file.name}`,
              'response:', xhr.responseText.slice(0, 200));
          reject(new Error('HTTP ' + xhr.status + ' for ' + file.name));
        }
      };
      xhr.onerror = () => {
        status.innerHTML = '<span class="danger">network error</span>';
        log(`[${row._index + 1}/${rows.length}] NETWORK ERROR: ${file.name}`);
        reject(new Error('network error for ' + file.name));
      };
      xhr.onabort = () => {
        status.innerHTML = '<span class="danger">aborted</span>';
        reject(new Error('aborted: ' + file.name));
      };
      xhr.open('POST', '/dash/packages/' + encodeURIComponent(pkgId)
                       + '/upload?_csrf=' + encodeURIComponent(csrf));
      xhr.send(fd);
    });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const files = state.files.slice();   // stable snapshot
    log(`submit: ${files.length} file(s) queued`);
    if (!files.length) {
      statusEl.innerHTML = '<span class="danger">Add at least one file before sending.</span>';
      return;
    }

    submitBtn.disabled = true;
    statusEl.textContent = 'creating package…';
    buildRows(files);

    // Phase 1 — POST metadata only
    const fd = new FormData(form);
    fd.delete('files');
    let pkgId;
    try {
      const resp = await fetch(form.action, { method: 'POST', body: fd, credentials: 'same-origin' });
      if (!resp.ok) throw new Error('create-pkg HTTP ' + resp.status);
      const j = await resp.json();
      pkgId = j.pkg_id;
      log('package created:', pkgId);
    } catch (err) {
      statusEl.innerHTML = '<span class="danger">Could not create package: ' + escapeHtml(err.message) + '</span>';
      submitBtn.disabled = false;
      return;
    }

    // Phase 2 — sequential per-file upload
    const errors = [];
    for (const row of rows) {
      statusEl.textContent = `uploading file ${row._index + 1} of ${rows.length} (${row._file.name})…`;
      try {
        await uploadOne(pkgId, row);
      } catch (err) {
        errors.push({ index: row._index + 1, name: row._file.name, message: err.message });
        log('upload error:', err);
      }
    }

    if (errors.length) {
      const lines = errors.map(e =>
        `  • file ${e.index} (${escapeHtml(e.name)}): ${escapeHtml(e.message)}`).join('<br>');
      statusEl.innerHTML =
        `<span class="danger">${errors.length} of ${rows.length} file(s) failed.</span><br>` +
        `<span class="muted" style="font-size:12px">${lines}</span><br>` +
        `<a href="/dash/packages/${pkgId}" class="btn" style="margin-top:8px">Open draft package</a>`;
      submitBtn.disabled = false;
      return;
    }

    // Summary
    const totalDur = rows.reduce((a, r) => a + (r._duration_ms || 0), 0);
    if (totalDur > 0) {
      const avgBps = totalBytes * 1000 / totalDur;
      overallTxt.textContent = 'Transferred ' + fmt(totalBytes) + ' in '
                             + fmtDuration(totalDur)
                             + ' (avg ' + fmt(avgBps) + '/s)';
    }

    // Phase 3 — finalize
    statusEl.textContent = 'sending notification…';
    try {
      const resp = await fetch('/dash/packages/' + encodeURIComponent(pkgId)
                               + '/finalize?_csrf=' + encodeURIComponent(csrf),
                               { method: 'POST', credentials: 'same-origin' });
      if (!resp.ok) throw new Error('finalize HTTP ' + resp.status);
      const j = await resp.json();
      log('finalized; redirecting to', j.redirect || ('/dash/packages/' + pkgId));
      window.location = j.redirect || ('/dash/packages/' + pkgId);
    } catch (err) {
      statusEl.innerHTML = '<span class="danger">Finalize failed: ' + escapeHtml(err.message)
                         + '. Files uploaded OK — <a href="/dash/packages/' + pkgId
                         + '">open the package</a> and click finalize from there.</span>';
      submitBtn.disabled = false;
    }
  });
})();
</script>
{% endblock %}
