<!doctype html>
<html><body style="font-family:-apple-system,Helvetica,Arial,sans-serif; max-width:560px; margin:0 auto; padding:20px; color:#222">
<p>Hi {{ to_name }},</p>
<p><b>{{ sender_name }}</b> is requesting files from you on {{ app_name }}.</p>
<p><b>Request:</b> {{ package_title }}</p>
{% if note %}<blockquote style="margin:12px 0; padding:8px 12px; border-left:3px solid #4f9eed; background:#f3f7fc; white-space:pre-wrap">{{ note }}</blockquote>{% endif %}
<p style="margin:24px 0">
  <a href="{{ link_url }}" style="background:#4f9eed; color:#fff; padding:10px 18px; border-radius:6px; text-decoration:none; font-weight:600">Upload files</a>
</p>
<p style="font-size:12px; color:#888">Link expires {{ expires_at }}. You can upload multiple files.<br>
If the button doesn't work, paste this URL: <code>{{ link_url }}</code></p>
</body></html>
