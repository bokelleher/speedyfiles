[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speedyfiles"
version = "0.1.0"
description = "Self-hosted file transfer that doesn't suck"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "SpeedyFiles contributors" }]
keywords = ["file-sharing", "self-hosted", "transfer", "wetransfer", "magic-link"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: File Sharing",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]

[project.urls]
Homepage = "https://speedyfiles.app"
Documentation = "https://speedyfiles.app/docs/"
Repository = "https://github.com/bokelleher/speedyfiles"
Issues = "https://github.com/bokelleher/speedyfiles/issues"
Changelog = "https://github.com/bokelleher/speedyfiles/blob/main/CHANGELOG.md"

[project.scripts]
speedyfiles = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/templates/"]

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "S",            # bandit (security)
    "C4",           # comprehensions
    "DTZ",          # naive datetimes — we deliberately use naive UTC, so we ignore some
    "T20",          # no print
    "PIE",
    "RET",          # return-related
    "SIM",          # simplify
]
ignore = [
    "E501",         # line too long (line-length handles it; long URLs in docstrings OK)
    "S101",         # asserts allowed (tests)
    "S104",         # binding to 0.0.0.0 (Docker container)
    "S105",         # hardcoded password — false positives on test fixtures
    "S106",         # same as above
    "DTZ005",       # we use naive UTC by convention; documented in utils.utcnow
    "B008",         # FastAPI's Depends(...) at default-value position is fine
    "B904",         # exception chaining; sometimes deliberately not chaining
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/", "app/templates/"]

[[tool.mypy.overrides]]
module = ["aioboto3.*", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
